[package]
name = "vanijliquor"
version = "1.0.7"
description = "VanijLiquor — Bar & Liquor POS (Tauri desktop shell)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vanijliquor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
