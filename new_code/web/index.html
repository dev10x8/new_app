<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Madhushala Pro</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-wrap">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="brand">
        <div class="brand-mark">MP</div>
        <div>
          <h1>Madhushala Pro</h1>
          <p class="muted">Bar &amp; Liquor POS</p>
        </div>
      </div>
      <label>User Code
        <input id="login-usercode" name="usercode" value="A00001" autocomplete="username" />
      </label>
      <label>Password
        <input id="login-password" name="password" type="password" value="admin" autocomplete="current-password" />
      </label>
      <button class="btn primary" type="submit">Sign in</button>
      <p id="login-error" class="error" hidden></p>
      <p class="muted small">Default: <code>A00001</code> / <code>admin</code></p>
    </form>
  </div>

  <!-- App shell -->
  <div id="app-view" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">MP</div>
        <div class="sidebar-title">Madhushala Pro</div>
      </div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <div class="who" id="who"></div>
        <button class="btn ghost small" id="logout-btn">Log out</button>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <button class="btn ghost icon" id="menu-toggle" title="Menu">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <div class="topbar-right">
          <span class="pill" id="company-pill">Company 1</span>
          <span class="pill" id="year-pill">Year 2024</span>
        </div>
      </header>

      <main id="page"></main>

      <div id="toast" class="toast" hidden></div>
      <div id="modal" class="modal" hidden>
        <div class="modal-card">
          <div class="modal-head">
            <h3 id="modal-title"></h3>
            <button class="btn ghost icon" id="modal-close">✕</button>
          </div>
          <div id="modal-body" class="modal-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
