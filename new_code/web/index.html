<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VanijLiquor</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // Apply the saved theme before first paint (no flash of the wrong theme).
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-wrap">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="brand">
        <div class="brand-mark">VL</div>
        <div>
          <h1>VanijLiquor</h1>
          <p class="muted">Bar &amp; Liquor POS</p>
        </div>
      </div>
      <label>User Code
        <input id="login-usercode" name="usercode" value="A00001" autocomplete="username" />
      </label>
      <label>Password
        <input id="login-password" name="password" type="password" value="admin" autocomplete="current-password" />
      </label>
      <button class="btn primary" type="submit">Sign in</button>
      <p id="login-error" class="error" hidden></p>
      <p class="muted small">Default: <code>A00001</code> / <code>admin</code></p>
    </form>
  </div>

  <!-- App shell -->
  <div id="app-view" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">VL</div>
        <div class="sidebar-title">VanijLiquor</div>
      </div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <div class="who" id="who"></div>
        <button class="btn ghost small" id="logout-btn">Log out</button>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <button class="btn ghost icon" id="menu-toggle" title="Menu">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <div class="topbar-right">
          <span class="pill gold" id="licence-pill" hidden></span>
          <span class="pill" id="company-pill">Company 1</span>
          <span class="pill" id="year-pill">Year 2024</span>
          <button class="btn ghost icon" id="theme-toggle" title="Switch theme" aria-label="Switch theme"></button>
        </div>
      </header>

      <main id="page"></main>

      <div id="license-banner" class="license-banner" hidden></div>

      <div id="clock-warning" class="clock-warning" hidden>
        System clock warning: the computer's date/time appears to have been set back. Business dates use the last known good date until the clock is corrected.
      </div>

      <div id="toast" class="toast" hidden></div>
      <div id="modal" class="modal" hidden>
        <div class="modal-card">
          <div class="modal-head">
            <h3 id="modal-title"></h3>
            <button class="btn ghost icon" id="modal-close">✕</button>
          </div>
          <div id="modal-body" class="modal-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
