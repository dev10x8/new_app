# docker-compose.yml - run the Madhushala Pro rebuild (new_code) in containers.
#
#   backend  : Node.js + SQLite API on http://localhost:7100
#   frontend : the web UI (the frontend of the Tauri desktop app) on
#              http://localhost:8080 - open it in a browser.
#
# Usage (from the repository root):
#
#   docker compose -f new_code/docker-compose.yml up --build
#
#   then open http://localhost:8080   (login: A00001 / admin)
#   and  http://localhost:7100/api/health
#
# The SQLite database is kept in the named volume `madhushala-data`, so it
# survives restarts. To wipe and reseed it:
#
#   docker compose -f new_code/docker-compose.yml down -v
#
# Set MADHUSHALA_PORT / WEB_PORT to change the published host ports.
#
# The desktop build of the same UI lives in new_code/tauri (Tauri = Web + Rust);
# it reuses new_code/web unchanged and does not need Docker.

name: madhushala-new

services:
  backend:
    build:
      context: ./backend
    image: madhushala-backend:latest
    container_name: madhushala-backend
    environment:
      HOST: "0.0.0.0"
      PORT: "7100"
      COMPANY: "${COMPANY:-1}"
      YEAR: "${YEAR:-2024}"
      MADHUSHALA_DB: "/data/madhushala.db"
    volumes:
      - madhushala-data:/data
    ports:
      - "${MADHUSHALA_PORT:-7100}:7100"
    restart: unless-stopped

  frontend:
    build:
      context: ./web
    image: madhushala-web:latest
    container_name: madhushala-web
    environment:
      # The web server proxies /api to the backend by its service name.
      API_URL: "http://backend:7100"
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  madhushala-data:
